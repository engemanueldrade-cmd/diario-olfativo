name: Supabase Keep-Alive (todos os projetos)

# Faz um ping real no banco de cada projeto pra evitar que o Supabase pause os
# projetos no plano gratuito por falta de atividade. Centralizado aqui porque
# este é o único repositório no GitHub entre os 4 apps — os outros 3 não têm
# repositório próprio.
#
# O job só passa se cada endpoint responder "ok":true (ou seja, se o Supabase
# respondeu de verdade), não apenas se o site da Vercel respondeu.
#
# Verificação: aba "Actions" deste repo, ou via API pública:
# https://api.github.com/repos/engemanueldrade-cmd/diario-olfativo/actions/workflows/supabase-keepalive.yml/runs

on:
  schedule:
    - cron: "0 */6 * * *" # a cada 6 horas
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping de cada projeto
        run: |
          status=0
          ping() {
            echo "== $1 =="
            body=$(curl -s --max-time 25 "$1")
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then
              :
            else
              echo "FALHOU"
              status=1
            fi
            echo
          }
          ping "https://planejador-de-casamento-phi.vercel.app/api/keepalive"
          ping "https://administrador-usina.vercel.app/api/keepalive"
          ping "https://personal-media-tracker-zeta.vercel.app/api/keepalive"
          ping "https://diario-olfativo.vercel.app/api/keepalive"
          exit $status
